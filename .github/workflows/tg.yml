name: MTProto Proxy with bore (Auto-Update README)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'مدت زمان فعال بودن پروکسی (دقیقه)'
        required: true
        default: '120'

jobs:
  mtproto-tunnel:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- نصب و اجرای سرور MTProto (mtg) ----------
      - name: Install and run mtg server
        shell: powershell
        run: |
          # دانلود mtg (پروکسی فوق‌سبک با پشتیبانی از Fake TLS)
          Invoke-WebRequest -Uri "https://github.com/9seconds/mtg/releases/latest/download/mtg-windows-amd64.exe" -OutFile "mtg.exe"

          # تولید سکرت (کلید) تصادفی ۱۶ بایتی به صورت هگز
          $bytes = New-Object byte[] 16
          (New-Object Random).NextBytes($bytes)
          $secret = -join ($bytes | ForEach-Object { $_.ToString('x2') })
          Write-Host "SECRET: $secret"

          # ذخیره سکرت در فایل برای مرحله بعد
          $secret | Out-File -FilePath secret.txt -Encoding utf8 -NoNewline

          # اجرای mtg روی پورت محلی 8080 با Fake TLS به دامنه cloudflare.com
          # (اجرا در پس‌زمینه با Start-Process)
          Start-Process -NoNewWindow -FilePath ".\mtg.exe" -ArgumentList "run --bind 127.0.0.1:8080 --secret $secret --fake-tls --domain cloudflare.com"
          
          # صبر برای اطمینان از بالا آمدن سرویس
          Start-Sleep -Seconds 5
          Write-Host "MTG server started on localhost:8080"

      # ---------- ساخت اسکریپت bore_runner (دقیقاً مشابه کد شما) ----------
      - name: Create bore runner script
        shell: powershell
        run: |
          $lines = @(
            '$outLog = "bore_out.log"',
            '$errLog = "bore_err.log"',
            '$tunnelHost = "bore.pub"',
            '',
            'function Start-Bore {',
            '  Start-Process -NoNewWindow -FilePath ".\bore.exe" -ArgumentList "local","8080","--to","bore.pub" -RedirectStandardOutput $outLog -RedirectStandardError $errLog',
            '  Start-Sleep -Seconds 8',
            '  $raw = Get-Content $outLog -Raw -ErrorAction SilentlyContinue',
            '  $clean = $raw -replace "\x1b\[[0-9;]*m", ""',
            '  if ($clean -match "listening at [\w\.]+:(\d+)") {',
            '    $port = $matches[1]',
            '    $connectionInfo = "host=$tunnelHost`nport=$port"',
            '    $connectionInfo | Out-File -FilePath connection.txt -Encoding utf8',
            '    Write-Host "Tunnel established on port $port"',
            '    return $port',
            '  }',
            '  return $null',
            '}',
            '',
            '# Keep-alive probe every 30s (چک کردن زنده بودن پروکسی محلی)',
            'Start-Job -ScriptBlock {',
            '  while ($true) {',
            '    try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect("127.0.0.1", 8080); $tcp.Close() } catch { }',
            '    Start-Sleep -Seconds 30',
            '  }',
            '} | Out-Null',
            '',
            '# Start bore for the first time',
            '$currentPort = Start-Bore',
            'if (-not $currentPort) {',
            '  Write-Host "ERROR: Could not start bore."',
            '  exit 1',
            '}',
            '',
            '# Monitor loop (در صورت قطع شدن دوباره راه‌اندازی کن)',
            'while ($true) {',
            '  Start-Sleep -Seconds 30',
            '  $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue',
            '  if (-not $boreProc) {',
            '    Write-Host "Bore stopped. Restarting..."',
            '    $currentPort = Start-Bore',
            '  }',
            '}'
          )
          $lines | Out-File -FilePath bore_runner.ps1 -Encoding utf8
          Write-Host "bore_runner.ps1 created."

      # ---------- دانلود bore و اجرا ----------
      - name: Download bore and start tunnel
        shell: powershell
        run: |
          # دانلود bore.exe
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/latest/download/bore-windows-x86_64.exe" -OutFile "bore.exe"

          # اجرای bore_runner در پس‌زمینه
          Start-Process -FilePath "powershell.exe" -ArgumentList "-File", "bore_runner.ps1" -WindowStyle Hidden
          Write-Host "Bore runner started in background."

          # صبر برای تولید connection.txt
          Write-Host "Waiting for tunnel to be ready..."
          for ($i=0; $i -lt 30; $i++) {
            if (Test-Path "connection.txt") { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path "connection.txt") {
            Write-Host "Tunnel is ready."
          } else {
            Write-Host "WARNING: Tunnel may not have started. Will try to continue."
          }

      # ---------- به‌روزرسانی README با لینک پروکسی ----------
      - name: Update README.md
        shell: powershell
        run: |
          if (-not (Test-Path "connection.txt")) {
            Write-Host "ERROR: connection.txt not found."
            exit 1
          }

          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          $hostAddr = $details.host   # = bore.pub
          $port = $details.port

          # خواندن سکرت از فایل
          $secret = Get-Content secret.txt -Raw -ErrorAction SilentlyContinue
          if (-not $secret) {
            Write-Host "ERROR: secret.txt not found."
            exit 1
          }

          # ساخت لینک tg://
          $tgLink = "tg://proxy?server=$hostAddr&port=$port&secret=$secret"

          $expiry = (Get-Date).AddMinutes(${{ github.event.inputs.session_minutes }}).ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'

          # ساخت بخش جدید README
          $newSection = "## MTProto Proxy Access`r`n"
          $newSection += "**Connection Link:** ``$tgLink``  `r`n"
          $newSection += "**Server:** `$hostAddr`  `r`n"
          $newSection += "**Port:** `$port`  `r`n"
          $newSection += "**Secret:** `$secret`  `r`n"
          $newSection += "**Expires:** $expiry  `r`n"

          if (-not (Test-Path "README.md")) {
            $readmeContent = $newSection
          } else {
            $readmeContent = Get-Content "README.md" -Raw -ErrorAction SilentlyContinue
            if ($readmeContent -match '## MTProto Proxy Access') {
              $readmeContent = $readmeContent -replace '(?s)## MTProto Proxy Access.*', $newSection
            } else {
              $readmeContent += "`r`n$newSection"
            }
          }

          $readmeContent | Out-File -FilePath "README.md" -Encoding utf8
          Write-Host "README.md updated."

      # ---------- ارسال تغییرات به مخزن ----------
      - name: Commit and push README.md
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update MTProto proxy info [skip ci]" --allow-empty
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- نمایش اطلاعات نهایی ----------
      - name: Display connection info
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          $secret = Get-Content secret.txt -Raw
          $tgLink = "tg://proxy?server=$($details.host)&port=$($details.port)&secret=$secret"

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "  MTProto PROXY READY FOR TELEGRAM"
          Write-Host "======================================================"
          Write-Host "  Server: $($details.host)"
          Write-Host "  Port: $($details.port)"
          Write-Host "  Secret: $secret"
          Write-Host "  Link: $tgLink"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "لینک بالا را در تلگرام (هر دستگاهی) باز کنید تا پروکسی تنظیم شود."
          Write-Host "اطلاعات در README.md مخزن نیز ذخیره شد."

      # ---------- نگه‌داشتن سشن تا پایان زمان ----------
      - name: Keep session alive
        shell: powershell
        run: |
          $duration = [int]${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes($duration)

          Write-Host "Session will stay active for $duration minutes."
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
            Write-Host "Remaining $remaining | $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
          Write-Host "Time is up."