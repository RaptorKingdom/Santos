name: Windows RDP via bore (No Signup, TCP Tunnel)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  rdp-tunnel:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and create user
        shell: powershell
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=yes
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f

          $username = "${{ secrets.RDP_USERNAME }}"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $username
          }

          try {
            $securePass = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name $username -Password $securePass -FullName "Remote Desktop User"
            Add-LocalGroupMember -Group "Administrators" -Member $username
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
            Write-Host "User $username created and RDP enabled."
          } catch {
            Write-Host "ERROR: $_"
            exit 1
          }

      - name: Download bore
        shell: powershell
        run: |
          # آخرین نسخه bore را از GitHub دریافت کن
          $releaseUrl = "https://github.com/ekzhang/bore/releases/latest/download/bore-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $releaseUrl -OutFile "bore.zip"
          Expand-Archive bore.zip -DestinationPath .
          # bore.exe داخل پوشه جدید خواهد بود
          $boreExe = Get-ChildItem -Recurse -Filter "bore.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $boreExe) {
            Write-Host "ERROR: bore.exe not found!"
            exit 1
          }
          # کپی به ریشه برای دسترسی آسان
          Copy-Item $boreExe -Destination .\bore.exe
          Write-Host "bore downloaded successfully."

      - name: Start bore tunnel for RDP
        shell: powershell
        run: |
          $boreLog = "bore.log"
          $boreErr = "bore_err.log"

          # اجرای bore با سرور عمومی bore.pub (بدون ثبت‌نام)
          Start-Process -NoNewWindow -FilePath ".\bore.exe" `
            -ArgumentList "local", "3389", "--to", "bore.pub" `
            -RedirectStandardOutput $boreLog -RedirectStandardError $boreErr

          Write-Host "Waiting for tunnel..."
          Start-Sleep -Seconds 8

          $boreHost = "bore.pub"
          $borePort = $null
          for ($i=1; $i -le 10; $i++) {
            if (Test-Path $boreLog) {
              $content = Get-Content $boreLog -Raw -ErrorAction SilentlyContinue
              # الگوی خروجی: "listening on bore.pub:12345"
              if ($content -match 'listening on\s+[\w\.]+:(\d+)') {
                $borePort = $matches[1]
                break
              }
            }
            Write-Host "Attempt $i/10..."
            Start-Sleep -Seconds 5
          }

          if (-not $borePort) {
            Write-Host "ERROR: Could not extract port."
            Write-Host "=== STDOUT ==="
            if (Test-Path $boreLog) { Get-Content $boreLog }
            Write-Host "=== STDERR ==="
            if (Test-Path $boreErr) { Get-Content $boreErr }
            exit 1
          }

          @"
          host=$boreHost
          port=$borePort
          "@ | Out-File -FilePath connection.txt -Encoding utf8

          Write-Host "Tunnel established."

      - name: Display connection information
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "  WINDOWS RDP READY FOR ANDROID"
          Write-Host "======================================================"
          Write-Host "  Host: $($details.host)"
          Write-Host "  Port: $($details.port)"
          Write-Host "  Username: ${{ secrets.RDP_USERNAME }}"
          Write-Host "  Password: (your secret)"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "In Microsoft Remote Desktop on Android:"
          Write-Host "  PC Name: $($details.host):$($details.port)"
          Write-Host "  User Name: ${{ secrets.RDP_USERNAME }}"
          Write-Host ""

      - name: Keep session alive
        shell: powershell
        run: |
          $duration = [int]${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes($duration)

          Write-Host "Session will stay active for $duration minutes."
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
            Write-Host "Remaining $remaining | $(Get-Date -Format 'HH:mm:ss')"

            if ((Get-Date).Minute % 5 -eq 0) {
              $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue
              if (-not $boreProc) {
                Write-Host "Tunnel lost. Restarting..."
                Start-Process -NoNewWindow -FilePath ".\bore.exe" `
                  -ArgumentList "local", "3389", "--to", "bore.pub"
              }
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Time is up."