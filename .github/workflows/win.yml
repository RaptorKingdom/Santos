name: Windows RDP via ngrok (No Token)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  rdp-tunnel:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and create user
        shell: powershell
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=yes
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f

          $username = "${{ secrets.RDP_USERNAME }}"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $username
          }

          try {
            $securePass = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name $username -Password $securePass -FullName "Remote Desktop User"
            Add-LocalGroupMember -Group "Administrators" -Member $username
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
            Write-Host "User $username created and RDP enabled."
          } catch {
            Write-Host "ERROR: $_"
            exit 1
          }

      - name: Download and setup ngrok
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive ngrok.zip -DestinationPath .
          Write-Host "ngrok downloaded."

      - name: Start ngrok TCP tunnel for RDP
        shell: powershell
        run: |
          Start-Process -NoNewWindow -FilePath ".\ngrok\ngrok.exe" `
            -ArgumentList "tcp", "3389", "--log=stdout" `
            -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log"

          Write-Host "Waiting for ngrok URL..."
          Start-Sleep -Seconds 10

          $ngrokHost = $null
          $ngrokPort = $null
          for ($i=1; $i -le 8; $i++) {
            $log = Get-Content ngrok.log -Raw -ErrorAction SilentlyContinue
            # الگوی جدید ngrok: tcp://0.tcp.ngrok.io:12345
            if ($log -match 'url=tcp://([^:]+):(\d+)') {
              $ngrokHost = $matches[1]
              $ngrokPort = $matches[2]
              break
            }
            Write-Host "Attempt $i/8..."
            Start-Sleep -Seconds 5
          }

          if (-not $ngrokHost) {
            Write-Host "ERROR: Could not extract ngrok URL."
            Get-Content ngrok.log
            Get-Content ngrok_err.log
            exit 1
          }

          @"
          host=$ngrokHost
          port=$ngrokPort
          "@ | Out-File -FilePath connection.txt -Encoding utf8

          Write-Host "ngrok tunnel established."

      - name: Display connection information
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "  WINDOWS RDP READY FOR ANDROID"
          Write-Host "======================================================"
          Write-Host "  Host: $($details.host)"
          Write-Host "  Port: $($details.port)"
          Write-Host "  Username: ${{ secrets.RDP_USERNAME }}"
          Write-Host "  Password: (your secret)"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "In Microsoft Remote Desktop on Android:"
          Write-Host "  PC Name: $($details.host):$($details.port)"
          Write-Host "  User Name: ${{ secrets.RDP_USERNAME }}"
          Write-Host ""

      - name: Keep session alive
        shell: powershell
        run: |
          $duration = [int]${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes($duration)

          Write-Host "Session will stay active for $duration minutes."
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
            Write-Host "Remaining $remaining | $(Get-Date -Format 'HH:mm:ss')"

            if ((Get-Date).Minute % 5 -eq 0) {
              $ng = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
              if (-not $ng) {
                Write-Host "ngrok lost. Restarting..."
                Start-Process -NoNewWindow -FilePath ".\ngrok\ngrok.exe" `
                  -ArgumentList "tcp", "3389", "--log=stdout"
              }
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Time is up."