name: Windows RDP with bore (Auto-Update README)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  rdp-tunnel:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable RDP and create user
        shell: powershell
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=yes
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f

          $username = "${{ secrets.RDP_USERNAME }}"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $username
          }

          try {
            $securePass = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name $username -Password $securePass -FullName "Remote Desktop User"
            Add-LocalGroupMember -Group "Administrators" -Member $username
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
            Write-Host "User $username created and RDP enabled."
          } catch {
            Write-Host "ERROR: $_"
            exit 1
          }

          Get-Service TermService | Start-Service

      - name: Create bore runner script
        shell: powershell
        run: |
          # ساخت فایل bore_runner.ps1 بدون استفاده از here-string
          $lines = @(
            '$outLog = "bore_out.log"',
            '$errLog = "bore_err.log"',
            '$tunnelHost = "bore.pub"',
            '',
            'function Start-Bore {',
            '  Start-Process -NoNewWindow -FilePath ".\bore.exe" -ArgumentList "local","3389","--to","bore.pub" -RedirectStandardOutput $outLog -RedirectStandardError $errLog',
            '  Start-Sleep -Seconds 8',
            '  $raw = Get-Content $outLog -Raw -ErrorAction SilentlyContinue',
            '  $clean = $raw -replace "\x1b\[[0-9;]*m", ""',
            '  if ($clean -match "listening at [\w\.]+:(\d+)") {',
            '    $port = $matches[1]',
            '    $connectionInfo = "host=$tunnelHost`nport=$port"',
            '    $connectionInfo | Out-File -FilePath connection.txt -Encoding utf8',
            '    Write-Host "Tunnel established on port $port"',
            '    return $port',
            '  }',
            '  return $null',
            '}',
            '',
            '# Keep-alive probe every 30s',
            'Start-Job -ScriptBlock {',
            '  while ($true) {',
            '    try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect("127.0.0.1", 3389); $tcp.Close() } catch { }',
            '    Start-Sleep -Seconds 30',
            '  }',
            '} | Out-Null',
            '',
            '# Start bore for the first time',
            '$currentPort = Start-Bore',
            'if (-not $currentPort) {',
            '  Write-Host "ERROR: Could not start bore."',
            '  exit 1',
            '}',
            '',
            '# Monitor loop',
            'while ($true) {',
            '  Start-Sleep -Seconds 30',
            '  $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue',
            '  if (-not $boreProc) {',
            '    Write-Host "Bore stopped. Restarting..."',
            '    $currentPort = Start-Bore',
            '  }',
            '}'
          )
          $lines | Out-File -FilePath bore_runner.ps1 -Encoding utf8
          Write-Host "bore_runner.ps1 created."

      - name: Start bore tunnel (detached)
        shell: powershell
        run: |
          # اجرا به عنوان یک فرآیند جداگانه که بعد از پایان این مرحله هم زنده بماند
          Start-Process -FilePath "powershell.exe" -ArgumentList "-File", "bore_runner.ps1" -WindowStyle Hidden
          Write-Host "Bore runner started in background."

          # صبر می‌کنیم تا فایل connection.txt ساخته شود
          Write-Host "Waiting for tunnel to be ready..."
          for ($i=0; $i -lt 30; $i++) {
            if (Test-Path "connection.txt") { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path "connection.txt") {
            Write-Host "Tunnel is ready."
          } else {
            Write-Host "WARNING: Tunnel may not have started. Will try to continue."
          }

      - name: Update README.md
        shell: powershell
        run: |
          if (-not (Test-Path "connection.txt")) {
            Write-Host "ERROR: connection.txt not found."
            exit 1
          }

          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          $connectionString = "$($details.host):$($details.port)"

          $username = "${{ secrets.RDP_USERNAME }}"
          $expiry = (Get-Date).AddMinutes(${{ github.event.inputs.session_minutes }}).ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'

          # ساخت محتوای جدید README بدون here-string
          $newSection = "## Windows RDP Access`r`n"
          $newSection += "**Connection Address:** ``$connectionString``  `r`n"
          $newSection += "**Username:** ``$username``  `r`n"
          $newSection += "**Password:** (stored in GitHub Secrets)  `r`n"
          $newSection += "**Expires:** $expiry  `r`n"

          if (-not (Test-Path "README.md")) {
            $readmeContent = $newSection
          } else {
            $readmeContent = Get-Content "README.md" -Raw -ErrorAction SilentlyContinue
            if ($readmeContent -match '## Windows RDP Access') {
              $readmeContent = $readmeContent -replace '(?s)## Windows RDP Access.*', $newSection
            } else {
              $readmeContent += "`r`n$newSection"
            }
          }

          $readmeContent | Out-File -FilePath "README.md" -Encoding utf8
          Write-Host "README.md updated."

      - name: Commit and push README.md
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update RDP access info [skip ci]" --allow-empty
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display connection info
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "  WINDOWS RDP READY FOR ANDROID"
          Write-Host "======================================================"
          Write-Host "  Host: $($details.host)"
          Write-Host "  Port: $($details.port)"
          Write-Host "  Username: ${{ secrets.RDP_USERNAME }}"
          Write-Host "  Password: (your secret)"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "In Microsoft Remote Desktop on Android:"
          Write-Host "  PC Name: $($details.host):$($details.port)"
          Write-Host "  User Name: ${{ secrets.RDP_USERNAME }}"
          Write-Host ""
          Write-Host "This info is also in README.md at the root of the repo."

      - name: Keep session alive
        shell: powershell
        run: |
          $duration = [int]${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes($duration)

          Write-Host "Session will stay active for $duration minutes."
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
            Write-Host "Remaining $remaining | $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
          Write-Host "Time is up."