name: Windows RDP for Android (Fixed)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  rdp-tunnel:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and create user
        shell: cmd
        run: |
          :: Enable RDP
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=yes
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f

          :: Create user with password from secrets
          net user %RDP_USERNAME% %RDP_PASSWORD% /add /fullname:"Remote Desktop User"
          net localgroup Administrators %RDP_USERNAME% /add
          net localgroup "Remote Desktop Users" %RDP_USERNAME% /add

          echo User %RDP_USERNAME% created and RDP enabled.
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

      - name: Download cloudflared
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          Write-Host "cloudflared downloaded."

      - name: Start Cloudflare Tunnel for RDP
        shell: powershell
        run: |
          Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel", "--url", "tcp://localhost:3389", "--no-autoupdate" `
            -RedirectStandardOutput "tunnel.log" -RedirectStandardError "tunnel_error.log"

          Write-Host "Waiting for tunnel URL..."
          Start-Sleep -Seconds 15

          $tcpHost = $null
          $tcpPort = $null
          for ($i=1; $i -le 6; $i++) {
            $log = Get-Content tunnel.log -Raw -ErrorAction SilentlyContinue
            if ($log -match 'tcp://([^:]+):(\d+)') {
              $tcpHost = $matches[1]
              $tcpPort = $matches[2]
              break
            }
            Write-Host "Attempt $i/6..."
            Start-Sleep -Seconds 5
          }

          if (-not $tcpHost) {
            Write-Host "ERROR: Could not extract tunnel URL."
            Get-Content tunnel.log
            Get-Content tunnel_error.log
            exit 1
          }

          @"
          host=$tcpHost
          port=$tcpPort
          "@ | Out-File -FilePath connection.txt -Encoding utf8

          Write-Host "Tunnel established."

      - name: Display connection information
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "  WINDOWS RDP READY FOR ANDROID"
          Write-Host "======================================================"
          Write-Host "  Host: $($details.host)"
          Write-Host "  Port: $($details.port)"
          Write-Host "  Username: ${{ secrets.RDP_USERNAME }}"
          Write-Host "  Password: (your secret)"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "In Microsoft Remote Desktop on Android:"
          Write-Host "  PC Name: $($details.host):$($details.port)"
          Write-Host "  User Name: ${{ secrets.RDP_USERNAME }}"
          Write-Host ""

      - name: Keep session alive
        shell: powershell
        run: |
          $duration = [int]${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes($duration)

          Write-Host "Session will stay active for $duration minutes."
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
            Write-Host "Remaining $remaining | $(Get-Date -Format 'HH:mm:ss')"

            if ((Get-Date).Minute % 5 -eq 0) {
              $cf = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue
              if (-not $cf) {
                Write-Host "Tunnel lost. Restarting..."
                Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" `
                  -ArgumentList "tunnel", "--url", "tcp://localhost:3389", "--no-autoupdate"
              }
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Time is up."