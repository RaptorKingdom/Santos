name: Windows RDP (Auto TCP Tunnel)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  rdp-tunnel:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and create user
        shell: powershell
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=yes
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f

          $username = "${{ secrets.RDP_USERNAME }}"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $username
          }

          try {
            $securePass = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name $username -Password $securePass -FullName "Remote Desktop User"
            Add-LocalGroupMember -Group "Administrators" -Member $username
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
            Write-Host "User $username created and RDP enabled."
          } catch {
            Write-Host "ERROR: $_"
            exit 1
          }

      - name: Download tunnel tool (bore or expose)
        shell: powershell
        run: |
          $tool = $null
          $dlUrl = $null

          # 1. تلاش برای دریافت آخرین نسخه bore
          try {
            Write-Host "Trying to download bore..."
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest"
            $asset = $release.assets | Where-Object { $_.name -like "*windows-msvc.exe" } | Select-Object -First 1
            if ($asset) {
              $dlUrl = $asset.browser_download_url
              $tool = "bore"
            }
          } catch {
            Write-Host "bore API failed: $_"
          }

          # 2. اگر bore در دسترس نبود، از expose استفاده کن
          if (-not $dlUrl) {
            Write-Host "bore not available. Falling back to expose..."
            try {
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/kernelshard/expose/releases/latest"
              $asset = $release.assets | Where-Object { $_.name -like "*windows-amd64.exe" } | Select-Object -First 1
              if ($asset) {
                $dlUrl = $asset.browser_download_url
                $tool = "expose"
              }
            } catch {
              Write-Host "expose API failed: $_"
            }
          }

          if (-not $dlUrl) {
            Write-Host "ERROR: No tunnel tool available."
            exit 1
          }

          Write-Host "Downloading $tool from $dlUrl"
          Invoke-WebRequest -Uri $dlUrl -OutFile "tunnel.exe"
          if (-not (Test-Path "tunnel.exe")) {
            Write-Host "ERROR: Download failed."
            exit 1
          }
          Write-Host "$tool downloaded."

          # ذخیره نام ابزار برای استفاده بعدی
          $tool | Out-File -FilePath tool_name.txt -Encoding utf8

      - name: Start tunnel
        shell: powershell
        run: |
          $tool = Get-Content tool_name.txt -Raw
          $outLog = "tunnel_out.log"
          $errLog = "tunnel_err.log"

          if ($tool -eq "bore") {
            Write-Host "Starting bore tunnel..."
            Start-Process -NoNewWindow -FilePath ".\tunnel.exe" `
              -ArgumentList "local", "3389", "--to", "bore.pub" `
              -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          } elseif ($tool -eq "expose") {
            Write-Host "Starting expose tunnel..."
            Start-Process -NoNewWindow -FilePath ".\tunnel.exe" `
              -ArgumentList "tunnel", "--port", "3389" `
              -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          } else {
            Write-Host "ERROR: Unknown tool $tool"
            exit 1
          }

          Write-Host "Waiting for tunnel..."
          Start-Sleep -Seconds 8

          $tunnelHost = $null
          $tunnelPort = $null
          for ($i=1; $i -le 10; $i++) {
            if (Test-Path $outLog) {
              $content = Get-Content $outLog -Raw -ErrorAction SilentlyContinue
              if ($tool -eq "bore" -and $content -match 'listening on\s+([\w\.]+):(\d+)') {
                $tunnelHost = $matches[1]
                $tunnelPort = $matches[2]
                break
              } elseif ($tool -eq "expose" -and $content -match 'tcp://([\w\.]+):(\d+)') {
                $tunnelHost = $matches[1]
                $tunnelPort = $matches[2]
                break
              }
            }
            Write-Host "Attempt $i/10..."
            Start-Sleep -Seconds 5
          }

          if (-not $tunnelPort) {
            Write-Host "ERROR: Could not extract host/port."
            Write-Host "=== stdout ==="
            if (Test-Path $outLog) { Get-Content $outLog }
            Write-Host "=== stderr ==="
            if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }

          @"
          host=$tunnelHost
          port=$tunnelPort
          "@ | Out-File -FilePath connection.txt -Encoding utf8

          Write-Host "Tunnel established."

      - name: Display connection info
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "  WINDOWS RDP READY FOR ANDROID"
          Write-Host "======================================================"
          Write-Host "  Host: $($details.host)"
          Write-Host "  Port: $($details.port)"
          Write-Host "  Username: ${{ secrets.RDP_USERNAME }}"
          Write-Host "  Password: (your secret)"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "In Microsoft Remote Desktop on Android:"
          Write-Host "  PC Name: $($details.host):$($details.port)"
          Write-Host "  User Name: ${{ secrets.RDP_USERNAME }}"
          Write-Host ""

      - name: Keep session alive
        shell: powershell
        run: |
          $duration = [int]${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes($duration)

          Write-Host "Session will stay active for $duration minutes."
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
            Write-Host "Remaining $remaining | $(Get-Date -Format 'HH:mm:ss')"

            if ((Get-Date).Minute % 5 -eq 0) {
              $proc = Get-Process -Name "tunnel" -ErrorAction SilentlyContinue
              if (-not $proc) {
                Write-Host "Tunnel lost. Restarting..."
                $tool = Get-Content tool_name.txt -Raw
                if ($tool -eq "bore") {
                  Start-Process -NoNewWindow -FilePath ".\tunnel.exe" `
                    -ArgumentList "local", "3389", "--to", "bore.pub"
                } else {
                  Start-Process -NoNewWindow -FilePath ".\tunnel.exe" `
                    -ArgumentList "tunnel", "--port", "3389"
                }
              }
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Time is up."