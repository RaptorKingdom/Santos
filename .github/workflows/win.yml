name: Windows RDP with bore (Auto-Update README)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  rdp-tunnel:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable RDP and create user
        shell: powershell
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=yes
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f

          $username = "${{ secrets.RDP_USERNAME }}"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $username
          }

          try {
            $securePass = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name $username -Password $securePass -FullName "Remote Desktop User"
            Add-LocalGroupMember -Group "Administrators" -Member $username
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
            Write-Host "User $username created and RDP enabled."
          } catch {
            Write-Host "ERROR: $_"
            exit 1
          }

          Get-Service TermService | Start-Service

      - name: Start bore tunnel
        shell: powershell
        run: |
          $outLog = "bore_out.log"
          $errLog = "bore_err.log"

          Start-Process -NoNewWindow -FilePath ".\bore.exe" `
            -ArgumentList "local", "3389", "--to", "bore.pub" `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog

          Write-Host "Waiting for tunnel..."
          Start-Sleep -Seconds 8

          $tunnelPort = $null
          for ($i=1; $i -le 10; $i++) {
            if (Test-Path $outLog) {
              $raw = Get-Content $outLog -Raw -ErrorAction SilentlyContinue
              $clean = $raw -replace '\x1b\[[0-9;]*m', ''
              if ($clean -match 'listening at [\w\.]+:(\d+)') {
                $tunnelPort = $matches[1]
                break
              }
            }
            Write-Host "Attempt $i/10..."
            Start-Sleep -Seconds 5
          }

          if (-not $tunnelPort) {
            Write-Host "ERROR: Could not extract port."
            Write-Host "=== stdout ==="
            if (Test-Path $outLog) { Get-Content $outLog }
            Write-Host "=== stderr ==="
            if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }

          $tunnelHost = "bore.pub"
          @"
          host=$tunnelHost
          port=$tunnelPort
          "@ | Out-File -FilePath connection.txt -Encoding utf8

          Write-Host "Tunnel established on port $tunnelPort."

          # Keep-alive job
          $keepAliveScript = {
            while ($true) {
              try {
                $tcp = New-Object Net.Sockets.TcpClient
                $tcp.Connect("127.0.0.1", 3389)
                $tcp.Close()
              } catch { }
              Start-Sleep -Seconds 30
            }
          }
          Start-Job -ScriptBlock $keepAliveScript | Out-Null

          # Monitoring loop (restarts bore if needed)
          while ($true) {
            Start-Sleep -Seconds 30
            $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue
            if (-not $boreProc) {
              Write-Host "Bore stopped. Restarting..."
              Start-Process -NoNewWindow -FilePath ".\bore.exe" `
                -ArgumentList "local", "3389", "--to", "bore.pub" `
                -RedirectStandardOutput $outLog -RedirectStandardError $errLog
              Start-Sleep -Seconds 8
              $raw = Get-Content $outLog -Raw -ErrorAction SilentlyContinue
              $clean = $raw -replace '\x1b\[[0-9;]*m', ''
              if ($clean -match 'listening at [\w\.]+:(\d+)') {
                $tunnelPort = $matches[1]
                @"
                host=$tunnelHost
                port=$tunnelPort
                "@ | Out-File -FilePath connection.txt -Encoding utf8
                Write-Host "Tunnel re-established on port $tunnelPort."
              }
            }
          }

      - name: Update README.md with connection info
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          $connectionString = "$($details.host):$($details.port)"

          # اگر README.md وجود ندارد، بساز
          if (-not (Test-Path "README.md")) {
            New-Item -Path "README.md" -ItemType File
          }

          # خواندن محتوای فعلی
          $readmeContent = Get-Content "README.md" -Raw -ErrorAction SilentlyContinue

          # متن جدیدی که می‌خواهیم اضافه یا جایگزین کنیم
          $newSection = @"
          ## Windows RDP Access
          **Connection Address:** `$connectionString`
          **Username:** `${{ secrets.RDP_USERNAME }}`
          **Password:** (stored in GitHub Secrets)
          **Expires:** $(Get-Date).AddMinutes(${{ github.event.inputs.session_minutes }}).ToString('yyyy-MM-dd HH:mm:ss') UTC
          "@

          # اگر بخش قبلی وجود داشت، آن را جایگزین کن
          if ($readmeContent -match '## Windows RDP Access') {
            $readmeContent = $readmeContent -replace '(?s)## Windows RDP Access.*', $newSection
          } else {
            # در غیر این صورت به انتهای فایل اضافه کن
            $readmeContent += "`r`n$newSection"
          }

          # نوشتن در فایل
          $readmeContent | Out-File -FilePath "README.md" -Encoding utf8
          Write-Host "README.md updated with connection info."

      - name: Commit and push README.md
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update RDP access info [skip ci]" --allow-empty
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display connection info
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "  WINDOWS RDP READY FOR ANDROID"
          Write-Host "======================================================"
          Write-Host "  Host: $($details.host)"
          Write-Host "  Port: $($details.port)"
          Write-Host "  Username: ${{ secrets.RDP_USERNAME }}"
          Write-Host "  Password: (your secret)"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "In Microsoft Remote Desktop on Android:"
          Write-Host "  PC Name: $($details.host):$($details.port)"
          Write-Host "  User Name: ${{ secrets.RDP_USERNAME }}"
          Write-Host ""
          Write-Host "This info is also in README.md at the root of the repo."

      - name: Keep session alive
        shell: powershell
        run: |
          $duration = [int]${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes($duration)

          Write-Host "Session will stay active for $duration minutes."
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
            Write-Host "Remaining $remaining | $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
          Write-Host "Time is up."