name: Windows Web Desktop (noVNC + UltraVNC + bore)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  web-desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Windows (enable RDP for fallback, set password)
        shell: powershell
        run: |
          # Set runneradmin password for any desktop interaction
          $password = "${{ secrets.RDP_PASSWORD }}"
          net user runneradmin $password
          # Enable RDP (optional, not used by noVNC)
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=yes
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          Write-Host "Windows ready."

      - name: Download and setup UltraVNC (portable)
        shell: powershell
        run: |
          $uvncZip = "uvnc.zip"
          $uvncUrl = "https://www.uvnc.eu/download/1420/uvnc_1420.zip"
          Write-Host "Downloading UltraVNC..."
          try {
            Invoke-WebRequest -Uri $uvncUrl -OutFile $uvncZip -ErrorAction Stop
          } catch {
            Write-Host "ERROR: Failed to download UltraVNC. $_"
            exit 1
          }
          Expand-Archive $uvncZip -DestinationPath ".\uvnc"
          $uvncDir = Get-ChildItem -Directory -Path ".\uvnc" | Select-Object -First 1
          if (-not $uvncDir) {
            Write-Host "ERROR: Could not find extracted UltraVNC folder."
            exit 1
          }
          # Move contents to a simpler path
          Copy-Item -Path "$($uvncDir.FullName)\*" -Destination ".\vnc" -Recurse
          Write-Host "UltraVNC extracted."

      - name: Configure and start UltraVNC server
        shell: powershell
        run: |
          $vncPassword = "${{ secrets.RDP_PASSWORD }}"
          # Set VNC password using setpasswd.exe (included)
          $setpasswd = Get-ChildItem -Recurse -Path ".\vnc" -Filter "setpasswd.exe" | Select-Object -First 1
          if ($setpasswd) {
            & $setpasswd.FullName $vncPassword
            Write-Host "VNC password set."
          } else {
            Write-Host "WARNING: setpasswd.exe not found, using insecure default password (may fail)."
          }

          # Start winvnc.exe in background
          $winvnc = Get-ChildItem -Recurse -Path ".\vnc" -Filter "winvnc.exe" | Select-Object -First 1
          if (-not $winvnc) {
            Write-Host "ERROR: winvnc.exe not found."
            exit 1
          }
          Start-Process -NoNewWindow -FilePath $winvnc.FullName -ArgumentList "-multi", "-run"
          Start-Sleep -Seconds 5
          Write-Host "UltraVNC server started on port 5900."

      - name: Install websockify and Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip websockify
          Write-Host "websockify installed."

      - name: Start websockify (WebSocket proxy)
        shell: powershell
        run: |
          Start-Process -NoNewWindow -FilePath "websockify" `
            -ArgumentList "6080", "localhost:5900" `
            -RedirectStandardOutput "ws.log" -RedirectStandardError "ws_err.log"
          Write-Host "websockify started on 6080 -> localhost:5900."

      - name: Download and prepare noVNC
        shell: powershell
        run: |
          $novncZip = "novnc.zip"
          $novncUrl = "https://github.com/novnc/noVNC/archive/refs/heads/master.zip"
          Invoke-WebRequest -Uri $novncUrl -OutFile $novncZip
          Expand-Archive $novncZip -DestinationPath ".\novnc-temp"
          $novncDir = Get-ChildItem -Directory -Path ".\novnc-temp" | Select-Object -First 1
          Copy-Item -Path "$($novncDir.FullName)\*" -Destination ".\novnc" -Recurse

          # Create an auto-connect page
          @"
          <!DOCTYPE html>
          <html>
          <head>
              <title>Windows Desktop</title>
              <style>
                  body { margin: 0; background: #000; }
                  #screen { width: 100vw; height: 100vh; }
              </style>
          </head>
          <body>
              <div id="screen"></div>
              <script src="core/js/pojo.js"></script>
              <script src="core/js/vnc.js"></script>
              <script>
                  var rfb = new RFB(document.getElementById('screen'), 'ws://' + location.hostname + ':6080');
                  rfb.scaleViewport = true;
                  rfb.resizeSession = true;
              </script>
          </body>
          </html>
          "@ | Out-File -FilePath ".\novnc\index.html" -Encoding utf8
          Write-Host "noVNC prepared."

      - name: Start Python HTTP server for noVNC
        shell: powershell
        run: |
          Start-Process -NoNewWindow -FilePath "python" `
            -ArgumentList "-m", "http.server", "8080", "--directory", "novnc" `
            -RedirectStandardOutput "http.log" -RedirectStandardError "http_err.log"
          Write-Host "HTTP server started on port 8080."

      - name: Start bore tunnel for web access
        shell: powershell
        run: |
          $outLog = "bore_out.log"
          $errLog = "bore_err.log"

          Start-Process -NoNewWindow -FilePath ".\bore.exe" `
            -ArgumentList "local", "8080", "--to", "bore.pub" `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog

          Write-Host "Waiting for tunnel..."
          Start-Sleep -Seconds 8

          $tunnelPort = $null
          for ($i=1; $i -le 10; $i++) {
            if (Test-Path $outLog) {
              $raw = Get-Content $outLog -Raw -ErrorAction SilentlyContinue
              $clean = $raw -replace '\x1b\[[0-9;]*m', ''
              if ($clean -match 'listening at [\w\.]+:(\d+)') {
                $tunnelPort = $matches[1]
                break
              }
            }
            Write-Host "Attempt $i/10..."
            Start-Sleep -Seconds 5
          }

          if (-not $tunnelPort) {
            Write-Host "ERROR: Could not extract port."
            Write-Host "=== stdout ==="
            if (Test-Path $outLog) { Get-Content $outLog }
            Write-Host "=== stderr ==="
            if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }

          @"
          host=bore.pub
          port=$tunnelPort
          "@ | Out-File -FilePath connection.txt -Encoding utf8

          Write-Host "Tunnel established on port $tunnelPort."

      - name: Display access URL
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "  WINDOWS DESKTOP - OPEN IN ANDROID BROWSER"
          Write-Host "======================================================"
          Write-Host "  URL: http://$($details.host):$($details.port)"
          Write-Host "  Username: runneradmin"
          Write-Host "  Password: (your secret)"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "On your Android device, open Chrome and go to:"
          Write-Host "  http://$($details.host):$($details.port)"
          Write-Host "You will see the full Windows desktop."
          Write-Host ""

      - name: Keep session alive
        shell: powershell
        run: |
          $duration = [int]${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes($duration)

          Write-Host "Session will stay active for $duration minutes."
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
            Write-Host "Remaining $remaining | $(Get-Date -Format 'HH:mm:ss')"

            if ((Get-Date).Minute % 5 -eq 0) {
              $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue
              if (-not $boreProc) {
                Write-Host "bore lost. Restarting..."
                Start-Process -NoNewWindow -FilePath ".\bore.exe" `
                  -ArgumentList "local", "8080", "--to", "bore.pub"
              }
              $vncProc = Get-Process -Name "winvnc" -ErrorAction SilentlyContinue
              if (-not $vncProc) {
                Write-Host "winvnc lost. Restarting..."
                $winvnc = Get-ChildItem -Recurse -Path ".\vnc" -Filter "winvnc.exe" | Select-Object -First 1
                if ($winvnc) { Start-Process -NoNewWindow -FilePath $winvnc.FullName -ArgumentList "-multi", "-run" }
              }
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Time is up."